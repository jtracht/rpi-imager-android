name: Android checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python3 scripts/prepare_upstream.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: python3 scripts/validate_customization.py
      - uses: actions/upload-artifact@v4
        with:
          name: pi-imager-debug
          path: app/build/outputs/apk/debug/*.apk
